version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    commit-message:
      prefix: "ci(deps)"